<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Escolha de perfil - Prato Justo">
    <title>Escolher perfil | Prato Justo</title>
    <link rel="stylesheet" href="./cadastro_perfil.css">
    <link rel="stylesheet" href="./header-styles.css">
    <link rel="stylesheet" href="termos-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<main class="page">
    <header class="brand">
        <div class="brand__logo" aria-hidden="true">🍽️</div>
        <h1 class="brand__title">Prato Justo</h1>
    </header>

    <section class="card" aria-labelledby="perfil-title">
        <h2 id="perfil-title" class="card__title">Escolha seu perfil</h2>
        <p class="intro">Selecione como deseja se cadastrar para continuarmos.</p>

        <div class="options" role="list">
            <button class="option" id="opt-pessoa" role="listitem">
                <div class="option__content">
                    <div class="option__title">Pessoa Física</div>
                    <div class="option__desc">Cadastro individual para doadores e beneficiários.</div>
                </div>
                <span class="option__icon" aria-hidden="true">→</span>
            </button>

            <button class="option" id="opt-org" role="listitem">
                <div class="option__content">
                    <div class="option__title">Estabelecimento / ONG</div>
                    <div class="option__desc">Para restaurantes, mercados, entidades e projetos sociais.</div>
                </div>
                <span class="option__icon" aria-hidden="true">→</span>
            </button>
        </div>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
            <div style="margin-bottom: 15px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 0.9rem; color: #333;">
                    <input type="checkbox" id="lei-termos" name="lei-termos" required style="margin-top: 3px;">
                    <span>
                        Li e aceito as <strong>Boas Práticas de Segurança Alimentar</strong> e a 
                        <a href="#" class="lei-link" style="color: #3498DB; text-decoration: underline; font-weight: 600; cursor: pointer;">Lei nº 14.016/2020</a> *
                    </span>
                </label>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 0.9rem; color: #333;">
                    <input type="checkbox" id="privacidade-termos" name="privacidade-termos" required style="margin-top: 3px;">
                    <span>
                        Li e concordo com os 
                        <a href="#" class="termos-link" style="color: #3498DB; text-decoration: underline; font-weight: 600; cursor: pointer;">Termos de Uso</a> 
                        e <a href="#" class="politica-link" style="color: #3498DB; text-decoration: underline; font-weight: 600; cursor: pointer;">Política de Privacidade</a> *
                    </span>
                </label>
            </div>
        </div>

        <p class="hint">Já possui conta? <a href="./login.html" class="link">Entrar</a></p>
    </section>

    <footer class="footer">
        <small>© <span id="ano"></span> Prato Justo. Todos os direitos reservados.</small>
    </footer>
</main>

<script src="termos-modal.js"></script>
<script src="lei-modal.js"></script>
<script src="politica-modal.js"></script>
<script src="./cadastro_perfil.js" defer></script>
</body>
</html>
